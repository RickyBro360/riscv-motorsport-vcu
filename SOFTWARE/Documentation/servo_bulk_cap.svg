<rect x="30" y="530" width="1660" height="196" rx="6" fill="#f4f8fb" stroke="#c9d6e2"/>
<text x="50" y="560" font-size="14" fill="#1b2430" font-weight="bold" text-anchor="start">Parts</text>
<text x="170" y="560" font-size="14" fill="#1b2430" font-weight="normal" text-anchor="start">C4 1000 µF, 16 V (10 V minimum), low-ESR, 105 °C, radial Ø10 mm, 5.0 mm pitch.   C5 100 nF X7R ceramic, 5.0 mm pitch.</text>
<text x="50" y="587" font-size="14" fill="#1b2430" font-weight="bold" text-anchor="start">Polarity</text>
<text x="170" y="587" font-size="14" fill="#1b2430" font-weight="normal" text-anchor="start">C4 + (long lead, square pad) to +5V, the striped side to GND. Reversed, it heats up and can vent.</text>
<text x="50" y="614" font-size="14" fill="#1b2430" font-weight="bold" text-anchor="start">Placement</text>
<text x="170" y="614" font-size="14" fill="#1b2430" font-weight="normal" text-anchor="start">C4 and C5 next to each other, within ~10 mm of J9 / J10 (the MG996R headers), right on the 1.5 mm +5V trace.</text>
<text x="170" y="641" font-size="14" fill="#1b2430" font-weight="normal" text-anchor="start">GND pad straight into the bottom ground pour; keep the +5V and GND path to the capacitor short and wide.</text>
<text x="50" y="668" font-size="14" fill="#1b2430" font-weight="bold" text-anchor="start">No re-spin?</text>
<text x="170" y="668" font-size="14" fill="#1b2430" font-weight="normal" text-anchor="start">Solder C4 (+ C5) directly across J15's two screw terminals — same circuit, slightly less effective.</text>
<text x="50" y="695" font-size="14" fill="#1b2430" font-weight="bold" text-anchor="start">Why</text>
<text x="170" y="695" font-size="14" fill="#1b2430" font-weight="normal" text-anchor="start">Servo start-up peaks of 2–4 A (stall up to ~8 A) are drawn from C4 for the first milliseconds, so +5V and VSYS don't sag and reset the VCU.</text>
</svg>